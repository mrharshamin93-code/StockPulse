# trigger
name: One-time StockDetail 250 hitbox original arrow
on:
  push:
    branches: [Financial-Datasets-Migration]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Set StockDetail back hitbox to 250 and restore arrow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Financial-Datasets-Migration
      - name: Patch StockDetail back control
        run: |
          python - <<'PY'
          from pathlib import Path

          stock = Path('src/pages/StockDetail.jsx')
          s = stock.read_text()
          old = '''              <ArrowLeft\n                width={30}\n                height={26}\n                strokeWidth={2.35}\n              />'''
          new = '''              <ArrowLeft\n                size={22}\n                strokeWidth={2.2}\n              />'''
          assert old in s, 'enlarged StockDetail arrow block not found'
          stock.write_text(s.replace(old, new, 1))

          css = Path('src/index.css')
          c = css.read_text()
          c = c.replace(
            ' * grows to exactly 150 × 150px so it is very forgiving on iPhone.',
            ' * grows to exactly 250 × 250px so it is extremely forgiving on iPhone.'
          )
          old_css = '''  width: 150px;\n  height: 150px;'''
          new_css = '''  width: 250px;\n  height: 250px;'''
          assert old_css in c, '150x150 StockDetail hitbox not found'
          css.write_text(c.replace(old_css, new_css, 1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/StockDetail.jsx src/index.css
          git diff --cached --quiet && exit 0
          git commit -m "Set StockDetail back hitbox to 250 and restore arrow"
          git push origin Financial-Datasets-Migration
