name: One-time instant StockDetail chart return
on:
  push:
    branches: [Financial-Datasets-Migration]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Render StockDetail chart return immediately'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Financial-Datasets-Migration
      - name: Patch StockDetail chart return initial state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/StockDetail.jsx')
          s = p.read_text()
          old = '''  const [primaryReturn, setPrimaryReturn] = useState(\n    activePeriod === "1D" && Number.isFinite(initialDailyReturn)\n      ? initialDailyReturn\n      : null\n  );'''
          new = '''  const [primaryReturn, setPrimaryReturn] = useState(() => {\n    if (activePeriod === "1D" && Number.isFinite(initialDailyReturn)) {\n      return initialDailyReturn;\n    }\n\n    const initialPoints = Array.isArray(initialChartData?.points)\n      ? initialChartData.points\n      : [];\n\n    return initialPoints.length > 0\n      ? calculatePeriodReturn(\n          initialPoints,\n          activePeriod,\n          initialDailyReturn\n        )\n      : null;\n  });'''
          assert old in s, 'primaryReturn initial state block not found'
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/StockDetail.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Render StockDetail chart return immediately"
          git push origin Financial-Datasets-Migration
