name: One-time extended session label style patch

on:
  push:
    branches:
      - Financial-Datasets-Migration
    paths:
      - .github/workflows/patch-extended-session-label.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Financial-Datasets-Migration

      - name: Style session label separately
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/StockDetail.jsx')
          text = path.read_text()

          old = '''              {extendedSession && Number.isFinite(extendedSession.percent) && (
                <p
                  className={[
                    "shrink-0 text-right text-[11px] font-medium",
                    extendedSession.percent >= 0
                      ? "text-emerald-600"
                      : "text-red-600",
                  ].join(" ")}
                >
                  {extendedSession.label}{" "}
                  {extendedSession.percent >= 0 ? "+" : ""}
                  {extendedSession.percent.toFixed(2)}%
                </p>
              )}'''

          new = '''              {extendedSession && Number.isFinite(extendedSession.percent) && (
                <p className="shrink-0 text-right text-[11px] font-medium">
                  <span className="text-muted-foreground/65">
                    {extendedSession.label}{" "}
                  </span>
                  <span
                    className={
                      extendedSession.percent >= 0
                        ? "text-emerald-600"
                        : "text-red-600"
                    }
                  >
                    {extendedSession.percent >= 0 ? "+" : ""}
                    {extendedSession.percent.toFixed(2)}%
                  </span>
                </p>
              )}'''

          if old not in text:
              raise SystemExit('Expected extended-session block was not found; refusing to modify the file.')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/StockDetail.jsx
          git commit -m "Style extended session label separately"
          git push origin HEAD:Financial-Datasets-Migration
