name: One-time stock detail prefetch patch

on:
  push:
    branches:
      - Financial-Datasets-Migration

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Prefetch stock detail critical data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Financial-Datasets-Migration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch StockDetail
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/StockDetail.jsx')
          s = p.read_text()

          marker = 'function formatXAxisTick(timestamp, period) {'
          helper = '''function calculateExtendedSession(points, currentPrice) {\n  const session = getCurrentExtendedSession();\n  const displayedCurrentPrice = roundPrice(currentPrice);\n\n  if (\n    !session ||\n    !Number.isFinite(displayedCurrentPrice) ||\n    displayedCurrentPrice <= 0 ||\n    !Array.isArray(points) ||\n    points.length < 1\n  ) {\n    return null;\n  }\n\n  const datedPoints = points\n    .map((point) => ({\n      ...point,\n      dateKey: getNewYorkDateKey(point.timestamp),\n    }))\n    .filter((point) => point.dateKey && Number.isFinite(point.value));\n\n  const baselinePoint = session.type === "after"\n    ? [...datedPoints]\n        .reverse()\n        .find((point) => point.dateKey === session.dateKey)\n    : [...datedPoints]\n        .reverse()\n        .find((point) => point.dateKey < session.dateKey);\n\n  const baselinePrice = roundPrice(baselinePoint?.value);\n\n  if (!Number.isFinite(baselinePrice) || baselinePrice <= 0) {\n    return null;\n  }\n\n  return {\n    label: session.label,\n    percent: ((displayedCurrentPrice - baselinePrice) / baselinePrice) * 100,\n  };\n}\n\n'''
          if helper not in s:
              assert marker in s
              s = s.replace(marker, helper + marker, 1)

          s = s.replace('''  onExtendedSessionChange,\n  initialDailyReturn,\n}) {''','''  onExtendedSessionChange,\n  initialDailyReturn,\n  initialChartData,\n}) {''', 1)

          s = s.replace('''  const [chartData, setChartData] = useState([]);''','''  const [chartData, setChartData] = useState(() => {\n    const points = Array.isArray(initialChartData?.points)\n      ? initialChartData.points\n      : [];\n\n    return points.map((point) => ({\n      timestamp: point.timestamp,\n      label: point.label,\n      primaryValue: point.value,\n    }));\n  });''', 1)

          s = s.replace('''  const tooltipTimerRef = useRef(null);\n  const chartContainerRef = useRef(null);''','''  const tooltipTimerRef = useRef(null);\n  const chartContainerRef = useRef(null);\n  const initialChartUsedRef = useRef(false);''', 1)

          s = s.replace('''    setShowInput(false);\n    onExtendedSessionChange?.(null);\n  }, [primaryTicker, onExtendedSessionChange]);''','''    setShowInput(false);\n  }, [primaryTicker]);''', 1)

          needle = '''    if (longRangeUnavailable) {\n      setChartData([]);\n      setChartError("");\n      setChartLoading(false);\n      return undefined;\n    }\n\n    const controller = new AbortController();'''
          replacement = '''    if (longRangeUnavailable) {\n      setChartData([]);\n      setChartError("");\n      setChartLoading(false);\n      return undefined;\n    }\n\n    const canUseInitialChart =\n      !initialChartUsedRef.current &&\n      !comparisonsActive &&\n      activePeriod === "1W" &&\n      initialChartData?.ticker === primaryTicker &&\n      Array.isArray(initialChartData?.points) &&\n      initialChartData.points.length > 0;\n\n    if (canUseInitialChart) {\n      initialChartUsedRef.current = true;\n\n      const primary = initialChartData.points;\n      const nextReturn = calculatePeriodReturn(\n        primary,\n        activePeriod,\n        initialDailyReturn\n      );\n\n      setChartData(\n        primary.map((point) => ({\n          timestamp: point.timestamp,\n          label: point.label,\n          primaryValue: point.value,\n        }))\n      );\n      setPrimaryReturn(nextReturn);\n      onPeriodReturnChange(nextReturn);\n      setChartError("");\n      setChartLoading(false);\n      return undefined;\n    }\n\n    const controller = new AbortController();'''
          assert needle in s
          s = s.replace(needle, replacement, 1)

          old_ext = '''        if (activePeriod === "1W") {\n          const session = getCurrentExtendedSession();\n          const displayedCurrentPrice = roundPrice(currentPrice);\n\n          if (session && Number.isFinite(displayedCurrentPrice) && displayedCurrentPrice > 0) {\n            const datedPoints = primary\n              .map((point) => ({\n                ...point,\n                dateKey: getNewYorkDateKey(point.timestamp),\n              }))\n              .filter((point) => point.dateKey && Number.isFinite(point.value));\n\n            const baselinePoint = session.type === "after"\n              ? [...datedPoints]\n                  .reverse()\n                  .find((point) => point.dateKey === session.dateKey)\n              : [...datedPoints]\n                  .reverse()\n                  .find((point) => point.dateKey < session.dateKey);\n\n            const baselinePrice = roundPrice(baselinePoint?.value);\n\n            if (Number.isFinite(baselinePrice) && baselinePrice > 0) {\n              const percent =\n                ((displayedCurrentPrice - baselinePrice) / baselinePrice) * 100;\n\n              onExtendedSessionChange?.({\n                label: session.label,\n                percent,\n              });\n            } else {\n              onExtendedSessionChange?.(null);\n            }\n          } else {\n            onExtendedSessionChange?.(null);\n          }\n        }'''
          new_ext = '''        if (activePeriod === "1W") {\n          onExtendedSessionChange?.(\n            calculateExtendedSession(primary, currentPrice)\n          );\n        }'''
          assert old_ext in s
          s = s.replace(old_ext, new_ext, 1)

          dep = '''    onExtendedSessionChange,\n    initialDailyReturn,\n  ]);'''
          assert dep in s
          s = s.replace(dep, '''    onExtendedSessionChange,\n    initialDailyReturn,\n    initialChartData,\n  ]);''', 1)

          state = '''  const [extendedSession, setExtendedSession] = useState(null);'''
          assert state in s
          s = s.replace(state, '''  const [extendedSession, setExtendedSession] = useState(null);\n  const [initialChartData, setInitialChartData] = useState(null);''', 1)

          reset = '''      setPeriodReturn(null);\n      setExtendedSession(null);'''
          assert reset in s
          s = s.replace(reset, '''      setPeriodReturn(null);\n      setExtendedSession(null);\n      setInitialChartData(null);''', 1)

          old_promise = '''          const [quoteResult, profileResult] = await Promise.allSettled([\n            marketDataProxy(\n              { action: "quote", ticker: tickerFromRoute },\n              controller.signal\n            ),\n            marketDataProxy(\n              { action: "profile", ticker: tickerFromRoute },\n              controller.signal\n            ),\n          ]);'''
          new_promise = '''          const [quoteResult, profileResult, chartResult] = await Promise.allSettled([\n            marketDataProxy(\n              { action: "quote", ticker: tickerFromRoute },\n              controller.signal\n            ),\n            marketDataProxy(\n              { action: "profile", ticker: tickerFromRoute },\n              controller.signal\n            ),\n            fetchChartData(\n              tickerFromRoute,\n              "1W",\n              controller.signal\n            ),\n          ]);'''
          assert old_promise in s
          s = s.replace(old_promise, new_promise, 1)

          quote_anchor = '''          if (Number.isFinite(resolvedQuote?.dp)) {\n            setDailyReturn(resolvedQuote.dp);\n          }\n\n          setStock({'''
          quote_repl = '''          if (Number.isFinite(resolvedQuote?.dp)) {\n            setDailyReturn(resolvedQuote.dp);\n          }\n\n          const initialPoints =\n            chartResult.status === "fulfilled"\n              ? chartResult.value\n              : [];\n\n          if (initialPoints.length > 0) {\n            setInitialChartData({\n              ticker: tickerFromRoute,\n              points: initialPoints,\n            });\n            setExtendedSession(\n              calculateExtendedSession(\n                initialPoints,\n                Number(resolvedQuote?.c) || cachedPrice\n              )\n            );\n          }\n\n          setStock({'''
          assert quote_anchor in s
          s = s.replace(quote_anchor, quote_repl, 1)

          portfolio_anchor = '''          if (Number.isFinite(cachedPortfolioQuote?.dp)) {\n            setDailyReturn(cachedPortfolioQuote.dp);\n          }\n\n          setStock({'''
          portfolio_repl = '''          if (Number.isFinite(cachedPortfolioQuote?.dp)) {\n            setDailyReturn(cachedPortfolioQuote.dp);\n          }\n\n          try {\n            const initialPoints = await fetchChartData(\n              normalizedTicker,\n              "1W",\n              controller.signal\n            );\n            const displayedPrice =\n              Number.isFinite(cachedPortfolioQuote?.c) &&\n              cachedPortfolioQuote.c > 0\n                ? cachedPortfolioQuote.c\n                : Number(data.current_price) || 0;\n\n            setInitialChartData({\n              ticker: normalizedTicker,\n              points: initialPoints,\n            });\n            setExtendedSession(\n              calculateExtendedSession(initialPoints, displayedPrice)\n            );\n          } catch (chartError) {\n            if (chartError?.name === "AbortError") return;\n            console.warn("Initial stock chart prefetch failed:", chartError);\n          }\n\n          setStock({'''
          assert portfolio_anchor in s
          s = s.replace(portfolio_anchor, portfolio_repl, 1)

          early = '''\n        setLoading(false);\n      }\n\n      try {\n        if (isTickerRoute) {'''
          assert early in s
          s = s.replace(early, '''\n      }\n\n      try {\n        if (isTickerRoute) {''', 1)

          prop = '''          onExtendedSessionChange={setExtendedSession}\n          initialDailyReturn={dailyReturn}\n        />'''
          assert prop in s
          s = s.replace(prop, '''          onExtendedSessionChange={setExtendedSession}\n          initialDailyReturn={dailyReturn}\n          initialChartData={initialChartData}\n        />''', 1)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/StockDetail.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Prefetch stock detail critical data"
          git push origin Financial-Datasets-Migration
