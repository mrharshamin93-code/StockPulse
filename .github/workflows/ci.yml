name: StockPulse CI

on:
  pull_request:
  push:
    branches:
      - Financial-Datasets-Migration

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck legacy JS
        continue-on-error: true
        run: npm run typecheck

      - name: Build
        run: npm run build
