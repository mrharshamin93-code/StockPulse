# trigger
name: One-time starred StockDetail cache patch
on:
  push:
    branches: [Financial-Datasets-Migration]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Render starred StockDetail instantly from cache'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Financial-Datasets-Migration
      - name: Patch StockDetail starred initial state
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/StockDetail.jsx')
          s=p.read_text()
          old='''  const stockId = isTickerRoute ? null : routeValue;\n  const synchronousPrefetch = isTickerRoute\n    ? readStockDetailPrefetch(tickerFromRoute)\n    : null;\n  const synchronousQuote = normalizePrefetchedQuote(synchronousPrefetch?.quote);\n  const synchronousPrice =\n    Number.isFinite(synchronousQuote?.c) && synchronousQuote.c > 0\n      ? synchronousQuote.c\n      : 0;\n  const synchronousPoints = Array.isArray(synchronousPrefetch?.points)\n    ? synchronousPrefetch.points\n    : [];\n\n  const [stock, setStock] = useState(() =>\n    synchronousPrefetch\n      ? {\n          ticker: tickerFromRoute,\n          company_name:\n            synchronousPrefetch?.profile?.name || tickerFromRoute,\n          sector: synchronousPrefetch?.profile?.sector || "",\n          logo_url: synchronousPrefetch?.profile?.logo || "",\n          current_price: synchronousPrice,\n          purchase_price: Number.isFinite(synchronousQuote?.pc)\n            ? synchronousQuote.pc\n            : synchronousPrice,\n          quantity: 0,\n          _watchlistOnly: true,\n        }\n      : null\n  );\n  const [loading, setLoading] = useState(() => !synchronousPrefetch);'''
          new='''  const stockId = isTickerRoute ? null : routeValue;\n  const synchronousTicker =\n    tickerFromRoute ||\n    String(location.state?.ticker || location.state?.symbol || "")\n      .trim()\n      .toUpperCase();\n  const synchronousRouteStock =\n    location.state?.stock && typeof location.state.stock === "object"\n      ? location.state.stock\n      : null;\n  const synchronousPrefetch = synchronousTicker\n    ? readStockDetailPrefetch(synchronousTicker)\n    : null;\n  const synchronousQuote =\n    normalizePrefetchedQuote(location.state?.quote) ||\n    normalizePrefetchedQuote(synchronousPrefetch?.quote);\n  const synchronousPrice =\n    Number.isFinite(synchronousQuote?.c) && synchronousQuote.c > 0\n      ? synchronousQuote.c\n      : Number(synchronousRouteStock?.current_price) || 0;\n  const synchronousPoints = Array.isArray(synchronousPrefetch?.points)\n    ? synchronousPrefetch.points\n    : [];\n\n  const [stock, setStock] = useState(() => {\n    if (synchronousRouteStock) {\n      return {\n        ...synchronousRouteStock,\n        ticker: synchronousTicker || synchronousRouteStock.ticker,\n        current_price:\n          synchronousPrice > 0\n            ? synchronousPrice\n            : synchronousRouteStock.current_price,\n        _watchlistOnly: false,\n      };\n    }\n\n    return synchronousPrefetch && isTickerRoute\n      ? {\n          ticker: tickerFromRoute,\n          company_name:\n            synchronousPrefetch?.profile?.name || tickerFromRoute,\n          sector: synchronousPrefetch?.profile?.sector || "",\n          logo_url: synchronousPrefetch?.profile?.logo || "",\n          current_price: synchronousPrice,\n          purchase_price: Number.isFinite(synchronousQuote?.pc)\n            ? synchronousQuote.pc\n            : synchronousPrice,\n          quantity: 0,\n          _watchlistOnly: true,\n        }\n      : null;\n  });\n  const [loading, setLoading] = useState(\n    () => !(synchronousPrefetch && (isTickerRoute || synchronousRouteStock))\n  );'''
          assert old in s
          s=s.replace(old,new,1)
          old2='''  const [initialChartData, setInitialChartData] = useState(() =>\n    synchronousPoints.length > 0\n      ? { ticker: tickerFromRoute, points: synchronousPoints }\n      : null\n  );'''
          new2='''  const [initialChartData, setInitialChartData] = useState(() =>\n    synchronousPoints.length > 0\n      ? { ticker: synchronousTicker, points: synchronousPoints }\n      : null\n  );'''
          assert old2 in s
          p.write_text(s.replace(old2,new2,1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/StockDetail.jsx
          git commit -m "Render starred StockDetail instantly from cache"
          git push origin Financial-Datasets-Migration
