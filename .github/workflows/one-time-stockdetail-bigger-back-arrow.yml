# trigger
name: One-time StockDetail bigger back arrow
on:
  push:
    branches: [Financial-Datasets-Migration]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Enlarge StockDetail back arrow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Financial-Datasets-Migration
      - name: Enlarge StockDetail back arrow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/StockDetail.jsx')
          s = p.read_text()
          old = '''              <ArrowLeft\n                size={22}\n                strokeWidth={2.2}\n              />'''
          new = '''              <ArrowLeft\n                width={30}\n                height={26}\n                strokeWidth={2.35}\n              />'''
          assert old in s, 'StockDetail back arrow block not found'
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/StockDetail.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Enlarge StockDetail back arrow"
          git push origin Financial-Datasets-Migration
