workflows:
  ios-simulator:
    name: StockPulse iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: latest

      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"

    cache:
      cache_paths:
        - "$HOME/.npm"
        - "$CM_BUILD_DIR/node_modules"

    scripts:
      - name: Install JavaScript dependencies
        script: |
          npm ci

      - name: Build StockPulse web app
        script: |
          npm run build

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios

      - name: Show available Xcode schemes
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -list

      - name: Build unsigned iOS Simulator app
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app"
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM"
      - "/tmp/xcodebuild_logs/*.log"
