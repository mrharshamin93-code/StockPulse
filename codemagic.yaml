workflows:
  ios-simulator:
    name: StockPulse iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - stockpulse_app

      node: 22
      xcode: latest

      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"

    cache:
      cache_paths:
        - "$HOME/.npm"
        - "$CM_BUILD_DIR/node_modules"

    scripts:
      - name: Install JavaScript dependencies
        script: |
          npm ci

      - name: Install native review plugin
        script: |
          npm install @capacitor-community/in-app-review@8.0.0 --save-exact

      - name: Build StockPulse web app
        script: |
          npm run build

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios

      - name: Show available Xcode schemes
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -list

      - name: Build unsigned iOS Simulator app
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app"
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM"
      - "/tmp/xcodebuild_logs/*.log"

  ios-testflight:
    name: StockPulse TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      groups:
        - appstore_credentials
        - stockpulse_app

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.harshamin.stockpulse

      node: 22
      xcode: latest

      vars:
        APP_STORE_APPLE_ID: "6808373094"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"

    cache:
      cache_paths:
        - "$HOME/.npm"
        - "$CM_BUILD_DIR/node_modules"
        - "$CM_BUILD_DIR/SourcePackages"

    scripts:
      - name: Install JavaScript dependencies
        script: |
          npm ci

      - name: Install native review plugin
        script: |
          npm install @capacitor-community/in-app-review@8.0.0 --save-exact

      - name: Build and sync Capacitor iOS
        script: |
          npm run build:ios

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles \
            --project "$XCODE_PROJECT"

      - name: Set iOS build number
        script: |
          NEXT_BUILD_NUMBER="$BUILD_NUMBER"

          if [ -z "$NEXT_BUILD_NUMBER" ] || [ "$NEXT_BUILD_NUMBER" -lt 2 ]; then
            NEXT_BUILD_NUMBER=2
          fi

          echo "Codemagic BUILD_NUMBER: $BUILD_NUMBER"
          echo "Using iOS build number: $NEXT_BUILD_NUMBER"

          sed -i '' \
            "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*;/CURRENT_PROJECT_VERSION = $NEXT_BUILD_NUMBER;/g" \
            ios/App/App.xcodeproj/project.pbxproj

          echo "Xcode build numbers after update:"
          grep "CURRENT_PROJECT_VERSION" ios/App/App.xcodeproj/project.pbxproj

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "-clonedSourcePackagesDirPath $CM_BUILD_DIR/SourcePackages"

    artifacts:
      - "build/ios/ipa/*.ipa"
      - "ios/App/build/ios/ipa/*.ipa"
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app"
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM"
      - "/tmp/xcodebuild_logs/*.log"

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
